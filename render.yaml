services:
  - type: web
    name: kenyawatch-ai-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node Backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kenyawatch-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

databases:
  - name: kenyawatch-db
    plan: free