<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KenyaWatch AI - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-8">
  <div class="max-w-6xl mx-auto">
    <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-bold text-emerald-400">KenyaWatch AI <span class="text-slate-500 text-lg font-normal">| Admin</span></h1>
      <a href="/" class="px-4 py-2 bg-slate-800 rounded-lg hover:bg-slate-700">View Public Site</a>
    </header>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-slate-900 p-6 rounded-xl border border-slate-800"><h3 class="text-slate-400 text-sm uppercase mb-2">Total Contracts</h3><p class="text-3xl font-bold" id="stat-contracts">Loading...</p></div>
      <div class="bg-slate-900 p-6 rounded-xl border border-slate-800"><h3 class="text-slate-400 text-sm uppercase mb-2">High Risk</h3><p class="text-3xl font-bold text-red-400" id="stat-high">Loading...</p></div>
      <div class="bg-slate-900 p-6 rounded-xl border border-slate-800"><h3 class="text-slate-400 text-sm uppercase mb-2">Pending Reports</h3><p class="text-3xl font-bold text-yellow-400" id="stat-reports">Loading...</p></div>
    </div>
    <div class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex justify-between"><h2 class="text-xl font-bold">Recent Reports</h2><button onclick="loadReports()" class="text-sm text-emerald-400">Refresh</button></div>
      <table class="w-full text-left text-sm"><thead class="bg-slate-800 text-slate-400"><tr><th class="p-4">Case</th><th class="p-4">Type</th><th class="p-4">County</th><th class="p-4">Status</th></tr></thead><tbody id="reports-table" class="divide-y divide-slate-800"><tr><td colspan="4" class="p-4 text-center text-slate-500">Loading...</td></tr></tbody></table>
    </div>
  </div>
  <script>
    async function loadStats() {
      try {
        const res = await fetch('/api/stats'); const data = await res.json();
        if (data.success) { document.getElementById('stat-contracts').textContent = data.data.contracts_total; document.getElementById('stat-high').textContent = data.data.contracts_flagged; }
        const rRes = await fetch('/api/reports'); const rData = await rRes.json();
        if (rData.success) document.getElementById('stat-reports').textContent = rData.data.filter(r => r.status === 'pending').length;
      } catch (e) {}
    }
    async function loadReports() {
      try {
        const res = await fetch('/api/reports'); const data = await res.json();
        const tbody = document.getElementById('reports-table'); tbody.innerHTML = '';
        if (data.success && data.data.length > 0) {
          data.data.forEach(r => { tbody.innerHTML += `<tr class="hover:bg-slate-800/50"><td class="p-4 font-mono">${r.case_number}</td><td class="p-4">${r.type}</td><td class="p-4">${r.county}</td><td class="p-4"><span class="px-2 py-1 rounded bg-yellow-500/20 text-yellow-400 text-xs">${r.status}</span></td></tr>`; });
        } else { tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">No reports.</td></tr>'; }
      } catch (e) {}
    }
    loadStats(); loadReports();
  </script>
</body>
</html>
